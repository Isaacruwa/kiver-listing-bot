name: Kiver Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Kiver listing bot
        run: curl --fail --silent --show-error --max-time 20 https://kiver-listing-bot.onrender.com/health > /dev/null
